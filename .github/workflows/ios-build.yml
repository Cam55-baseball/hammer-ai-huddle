name: ios-build

# Release A (owner Nov 8): every change to the iPhone project, the plugin list or the
# Capacitor config must still compile for the iOS Simulator. Signing is disabled, so no
# Apple secrets are needed. Pass/fail shows on the commit in GitHub.

on:
  push:
    paths:
      - "ios/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.*"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.*"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: oven-sh/setup-bun@v2
      - name: Install
        # Lovable maintains bun.lock (package-lock.json drifts).
        run: bun install --frozen-lockfile
      - name: Build the web app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx vite build
      - name: Sync into the iPhone project
        run: npx cap sync ios
      - name: Show Xcode
        run: xcodebuild -version
      - name: Compile the App scheme for the iOS Simulator (no signing)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
          if-no-files-found: ignore
