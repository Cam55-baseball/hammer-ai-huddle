name: ios-build

# Release A (owner Nov 8): every change to the iPhone project, the plugin list or the
# Capacitor config must still compile for the iOS Simulator. Signing is disabled, so no
# Apple secrets are needed. Pass/fail shows on the commit in GitHub.

on:
  push:
    paths:
      - "ios/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.*"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.*"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    # Nov 9 fix: the resolved Stripe iOS package (26.x) uses iOS 26 SDK APIs, so it needs Xcode 26.
    # macos-26 (Apple silicon) ships Xcode 26.0.1-26.6; 26.6 is pinned below so a runner default change can't drift.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: oven-sh/setup-bun@v2
      - name: Install
        # Lovable maintains bun.lock (package-lock.json drifts).
        # --ignore-scripts (owner fix Nov 9): skips the native "canvas" compile. canvas is only an
        # optional add-on of fabric (Node-only; the browser and the iPhone web view use their own
        # canvas) and nothing in the app imports it. No canvas binary exists for Node 22 on macOS
        # arm64, so its install script tried to compile and failed. The other skipped scripts
        # (esbuild, @swc/core, core-js, protobufjs) are checks/banners; their binaries still install.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the web app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx vite build
      - name: Sync into the iPhone project
        run: npx cap sync ios
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i "simulator"
      - name: Compile the App scheme for the iOS Simulator (no signing)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
          if-no-files-found: ignore
