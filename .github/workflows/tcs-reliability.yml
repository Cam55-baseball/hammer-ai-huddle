name: tcs-reliability

# Tissue Cost Scheduler reliability gate (v1 spec §7, v1.1 addendum §7).
# Two tiers: a fast tier on every build (CI-blocking) and a nightly full sweep.
# Any invariant, golden or chaos failure blocks the build.

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/wic/schedule/tissueCost/**'
      - 'src/test/tissueCost/**'
      - 'scripts/audits/tcs-property-sweep.ts'
      - '.github/workflows/tcs-reliability.yml'
  push:
    branches: [main]
  schedule:
    # nightly full sweep
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  fast-tier:
    # v1.1 §7 fast tier: goldens, chaos, v1.1 engines and >= 2,000 seasons.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: npm ci
      - name: Goldens, chaos, v1.1 engines, invariant slice
        run: npx vitest run src/test/tissueCost src/test/ubPlyo
        env:
          TCS_SEED: '20260920'
          TCS_SEASONS: '200'
      - name: Property sweep — 2,000 athlete-seasons (I1–I9)
        run: bun scripts/audits/tcs-property-sweep.ts 2000 8 20260920

  full-tier:
    # v1.1 §7 full tier: nightly, results stored; a failure blocks the next release.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: npm ci
      - name: 100,000 athlete-seasons
        run: bun scripts/audits/tcs-property-sweep.ts 100000 16 20260920 | tee tcs-full-sweep.json

      - name: Upper-body plyo full tier (100,000 cases)
        env:
          UBP_CASES: '100000'
          UBP_SEED: '20260920'
        run: npx vitest run src/test/ubPlyo
      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-full-sweep
          path: tcs-full-sweep.json
          retention-days: 90
